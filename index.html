/* =========================================================
   PRICE FORMAT
   ========================================================= */

function formatPrice(price) {

  const converted =
    Number(price) *
    currencyRates[currentCurrency];


  return new Intl.NumberFormat(
    currentLanguage === "sv"
      ? "sv-SE"
      : currentLanguage,
    {
      maximumFractionDigits:
        currentCurrency === "SEK"
          ? 0
          : 2
    }
  ).format(converted)
    + " "
    + currentCurrency;

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHTML(value) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================================
   RENDER PRODUCTS
   ========================================================= */

function renderProducts() {

  let products =
    [...PRODUCTS];


  /* -----------------------------------------
     SEARCH
     ----------------------------------------- */

  const search =
    searchInput.value
      .trim()
      .toLowerCase();


  if (search) {

    products =
      products.filter(
        product => {

          const name =
            String(
              product.name || ""
            ).toLowerCase();


          const description =
            String(
              product.description || ""
            ).toLowerCase();


          return (
            name.includes(search)
            ||
            description.includes(search)
          );

        }
      );

  }


  /* -----------------------------------------
     SORT
     ----------------------------------------- */

  const sort =
    sortSelect.value;


  if (sort === "low") {

    products.sort(
      (a,b) =>
        Number(a.price) -
        Number(b.price)
    );

  }


  if (sort === "high") {

    products.sort(
      (a,b) =>
        Number(b.price) -
        Number(a.price)
    );

  }


  if (sort === "az") {

    products.sort(
      (a,b) =>
        String(a.name)
          .localeCompare(
            String(b.name),
            currentLanguage
          )
    );

  }


  if (sort === "za") {

    products.sort(
      (a,b) =>
        String(b.name)
          .localeCompare(
            String(a.name),
            currentLanguage
          )
    );

  }


  /* -----------------------------------------
     CLEAR
     ----------------------------------------- */

    "";


  /* -----------------------------------------
     TRANSLATION
     ----------------------------------------- */

    translations[currentLanguage];


  /* -----------------------------------------
     COUNT
     ----------------------------------------- */

    document.getElementById(
      "resultCount"
    );

  /* -----------------------------------------

    "filterText"

      const card =

          "article"

      card.style.animationDelay =
        Math.min(
          index * 15,

      card.addEventListener(
        "click",
        () => openProduct(product)
      );


      /* IMAGE CONTAINER */

      const imageContainer =
        document.createElement(
          "div"
        );


      imageContainer.className =
        "product-image-container";


      /* IMAGE */

      const image =
        document.createElement(
          "img"
        );


      image.className =
        "product-image";


      image.src =
        product.images &&
        product.images[0]
          ? product.images[0]
          : "";


      image.alt =
        product.name;


      image.loading =
        index < 8
          ? "eager"
          : "lazy";


      /* PLACEHOLDER */

      const placeholder =
        document.createElement(
          "div"
        );


      placeholder.className =
        "image-placeholder";


      placeholder.innerHTML = `

        <div class="image-placeholder-icon">
          🖼️
        </div>

        <span>
          Bild läggs till här

      `;


      /* IMAGE ERROR */

      image.addEventListener(
        "error",
        function() {

          image.style.display =
            "none";

          placeholder.style.display =
            "flex";

        }
      );


      /* BADGE */

      const badge =
        document.createElement(

/* =========================================================
   OPEN PRODUCT
   ========================================================= */

function openProduct(product) {

  currentProduct =
    product;


  const t =
    translations[currentLanguage];


  const mainImage =
    document.getElementById(
      "mainProductImage"
    );


  const thumbnails =
    document.getElementById(
      "thumbnailContainer"
    );


  /* NAME */

  document.getElementById(
    "modalProductName"
  ).textContent =
    product.name;


  /* PRICE */

  document.getElementById(
    "modalProductPrice"
  ).textContent =
    formatPrice(
      product.price
    );


  /* DESCRIPTION */

  document.getElementById(
    "modalProductDescription"
  ).textContent =
    product.description;


  /* SIZE TITLE */

  document.getElementById(
    "sizeHeading"
  ).textContent =
    t.sizes;


  /* COPY BUTTON */

  document.getElementById(
    "copyProductButton"
  ).textContent =
    t.copy;


  /* OPEN BUTTON */

  const goatedButton =
    document.getElementById(
      "goatedButton"
    );


  goatedButton.textContent =
    t.open;


  /* -----------------------------------
     MAIN IMAGE
     ----------------------------------- */

  const firstImage =
    product.images &&
    product.images.length
      ? product.images[0]
      : "";


  mainImage.src =
    firstImage;


  mainImage.alt =
    product.name;


  /* -----------------------------------
     THUMBNAILS
     ----------------------------------- */

  thumbnails.innerHTML =
    "";


  if (
    product.images &&
    product.images.length
  ) {

    product.images.forEach(
      (image,index) => {

        const thumbnail =
          document.createElement(
            "img"
          );


        thumbnail.className =
          "thumbnail";


        if(index === 0){

          thumbnail.classList.add(
            "active"
          );

        }


        thumbnail.src =
          image;


        thumbnail.alt =
          product.name +
          " bild " +
          (index + 1);


        thumbnail.addEventListener(
          "error",
          function(){

            thumbnail.style.display =
              "none";

          }
        );


        thumbnail.addEventListener(
          "click",
          function(event){

            event.stopPropagation();


            mainImage.src =
              image;


            document
              .querySelectorAll(
                ".thumbnail"
              )
              .forEach(
                item =>
                  item.classList.remove(
                    "active"
                  )
              );


            thumbnail.classList.add(
              "active"
            );

          }
        );


        thumbnails.appendChild(
          thumbnail
        );

      }
    );

  }


  /* -----------------------------------
     SIZES
     ----------------------------------- */

  const modalSizes =
    document.getElementById(
      "modalSizes"
    );


  modalSizes.innerHTML =
    "";


  if (
    product.sizes &&
    product.sizes.length
  ) {

    product.sizes.forEach(
      size => {

        const pill =
          document.createElement(
            "span"
          );


        pill.className =
          "size-pill";


        pill.textContent =
          size;


        modalSizes.appendChild(
          pill
        );

      }
    );

  }


  /* -----------------------------------
     PRODUCT LINK
     ----------------------------------- */

  goatedButton.onclick =
    null;


  if (
    product.link &&
    product.link !==
      "DIN_PRODUKTLÄNK_HÄR"
  ) {

    goatedButton.href =
      product.link;

    goatedButton.target =
      "_blank";

  } else {

    goatedButton.href =
      "#";


    goatedButton.onclick =
      function(event){

        event.preventDefault();


        alert(
          "Lägg först in produktens riktiga länk i PRODUCTS."
        );

      };

  }


  /* -----------------------------------
     OPEN MODAL
     ----------------------------------- */

  productModal.classList.add(
    "active"
  );


  productModal.setAttribute(
    "aria-hidden",
    "false"
  );


  document.body.classList.add(
    "modal-open"
  );

}


/* =========================================================
   CLOSE MODAL
   ========================================================= */

function closeModal() {

  productModal.classList.remove(
    "active"
  );


  productModal.setAttribute(
    "aria-hidden",
    "true"
  );


  document.body.classList.remove(
    "modal-open"
  );

}

async function copyProductLink() {

  if (!currentProduct) {
    return;
  }


  const link =
    currentProduct.link;


  if (
    !link ||
    link ===
      "DIN_PRODUKTLÄNK_HÄR"
  ) {

    alert(
      "Lägg först in produktens länk i PRODUCTS."
    );

    return;

  }


  try {

    await navigator.clipboard.writeText(
      link
    );


    const button =
      document.getElementById(
        "copyProductButton"
      );


    const original =
      translations[currentLanguage]
        .copy;


    button.textContent =
      translations[currentLanguage]
        .copied;


    setTimeout(
      function(){

        button.textContent =
          original;

      },
      1800
    );


  } catch(error) {

    const textarea =
      document.createElement(
        "textarea"
      );


    textarea.value =
      link;


    textarea.style.position =
      "fixed";


    textarea.style.opacity =
      "0";


    document.body.appendChild(
      textarea
    );


    textarea.focus();


    textarea.select();


    document.execCommand(
      "copy"
    );


    textarea.remove();


    alert(
      "Produktlänken har kopierats!"
    );

  }

}


/* =========================================================
   UPDATE LANGUAGE
   ========================================================= */

function updateLanguage() {

  const t =
    translations[currentLanguage];


  /* SEARCH */

  searchInput.placeholder =
    t.search;


  /* HERO */

  const heroDescription =
    document.getElementById(
      "heroDescription"
    );


  if(heroDescription){

    heroDescription.textContent =
      t.hero;

  }


  /* PRODUCTS TITLE */

  const productsTitle =
    document.getElementById(
      "productsTitle"
    );


  if(productsTitle){

    productsTitle.textContent =
      t.productsTitle;

  }


  /* DESCRIPTION */

  const sectionDescription =
    document.getElementById(
      "sectionDescription"
    );


  if(sectionDescription){

    sectionDescription.textContent =
      t.description;

  }


  /* NO RESULTS */

  const noResultsTitle =
    document.querySelector(
      "#noResults h3"
    );


  if(noResultsTitle){

    noResultsTitle.textContent =
      t.noResults;

  }


  /* RENDER */

  renderProducts();


  /* UPDATE OPEN MODAL */

  if(currentProduct){

    document.getElementById(
      "modalProductName"
    ).textContent =
      currentProduct.name;


    document.getElementById(
      "modalProductPrice"
    ).textContent =
      formatPrice(
        currentProduct.price
      );


    document.getElementById(
      "modalProductDescription"
    ).textContent =
      currentProduct.description;


    document.getElementById(
      "sizeHeading"
    ).textContent =
      t.sizes;


    document.getElementById(
      "copyProductButton"
    ).textContent =
      t.copy;


    document.getElementById(
      "goatedButton"
    ).textContent =
      t.open;

  }

}


/* =========================================================
   SEARCH
   ========================================================= */

searchInput.addEventListener(
  "input",
  function(){

    clearSearch.classList.toggle(
      "show",
      this.value.trim().length > 0
    );


    renderProducts();

  }
);


/* =========================================================
   CLEAR SEARCH
   ========================================================= */

clearSearch.addEventListener(
  "click",
  function(){

    searchInput.value =
      "";


    clearSearch.classList.remove(
      "show"
    );


    renderProducts();


    searchInput.focus();

  }
);


/* =========================================================
   SORT
   ========================================================= */

sortSelect.addEventListener(

  }
);


/* =========================================================

/* =========================================================
   ESCAPE KEY
   ========================================================= */

document.addEventListener(
  "keydown",
  function(event){

    if(
      event.key ===
      "Escape"
    ){

      closeModal();

      closeWelcome();

    }

  }
);


/* =========================================================
   SCROLL TO PRODUCTS
   ========================================================= */

function scrollToProducts(){

  const section =
    document.getElementById(
      "productsSection"
    );


  if(section){

    section.scrollIntoView({
      behavior:"smooth",
      block:"start"
    });

  }

}


/* =========================================================
   FOCUS SEARCH
   ========================================================= */

function focusSearch(){

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });


  setTimeout(
    function(){

      searchInput.focus();

    },
    350
  );

}


/* =========================================================
   WELCOME POPUP
   ========================================================= */

function closeWelcome(){

  if(
    welcomeOverlay
  ){

    welcomeOverlay.style.display =
      "none";

  }


  try{

    localStorage.setItem(
      "alexfynds_welcome_seen",
      "1"
    );

  }catch(error){}

}


/* =========================================================
   WELCOME MEMORY
   ========================================================= */

try{

  const welcomeSeen =
    localStorage.getItem(
      "alexfynds_welcome_seen"
    );


  if(
    welcomeSeen === "1"
  ){

    welcomeOverlay.style.display =
      "none";

  }

}catch(error){}
