 html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AlexFynds</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0
}

body{
font-family:Arial,Helvetica,sans-serif;
background:#f5f5f7;
color:#111
}

header{
position:sticky;
top:0;
z-index:100;
background:rgba(255,255,255,.94);
backdrop-filter:blur(15px);
border-bottom:1px solid #e8e8e8
}

.nav{
max-width:1400px;
margin:auto;
min-height:75px;
padding:12px 25px;
display:flex;
align-items:center;
justify-content:space-between
}

.logo-area{
display:flex;
align-items:center;
gap:11px
}

.logo-icon,
.footer-icon,
.welcome-logo{
background:#111;
color:#fff;
display:flex;
align-items:center;
justify-content:center;
font-weight:900
}

.logo-icon{
width:43px;
height:43px;
border-radius:13px
}

.logo{
font-size:24px;
font-weight:900;
letter-spacing:-1px
}

.settings{
position:relative
}

.settings-btn{
border:1px solid #ddd;
background:#fff;
padding:11px 14px;
border-radius:12px;
cursor:pointer;
font-weight:600
}

.settings-menu{
display:none;
position:absolute;
right:0;
top:55px;
width:235px;
background:#fff;
padding:18px;
border-radius:17px;
border:1px solid #e5e5e5;
box-shadow:0 20px 50px rgba(0,0,0,.15)
}

.settings-menu.active{
display:block
}

.settings-menu label{
display:block;
font-size:12px;
font-weight:700;
margin-bottom:7px
}

.settings-menu select{
width:100%;
padding:11px;
border:1px solid #ddd;
border-radius:9px;
background:#fff;
margin-bottom:15px
}

.hero{
max-width:1400px;
margin:30px auto;
padding:0 25px
}

.hero-box{
position:relative;
overflow:hidden;
background:#111;
color:white;
border-radius:27px;
padding:65px 50px;
box-shadow:0 20px 60px rgba(0,0,0,.13)
}

.hero-content{
position:relative;
z-index:2
}

.hero-badge,
.welcome-badge{
display:inline-block;
background:#222;
border:1px solid #333;
padding:8px 12px;
border-radius:30px;
font-size:10px;
letter-spacing:1px;
font-weight:800;
margin-bottom:18px
}

.hero h1{
font-size:54px;
letter-spacing:-2.5px;
margin-bottom:10px
}

.hero p{
color:#bbb;
font-size:19px
}

.search-area{
max-width:1400px;
margin:auto;
padding:0 25px 28px
}

.search{
width:100%;
border:1px solid #dedede;
background:#fff;
padding:17px 19px;
border-radius:14px;
font-size:15px;
outline:none
}

.products{
max-width:1400px;
margin:auto;
padding:0 25px 80px;
display:grid;
grid-template-columns:repeat(4,1fr);
gap:20px
}

.product-card{
background:#fff;
border:1px solid #e5e5e5;
border-radius:18px;
overflow:hidden;
cursor:pointer;
transition:.2s;
box-shadow:0 3px 10px rgba(0,0,0,.025)
}

.product-card:hover{
transform:translateY(-5px);
box-shadow:0 18px 40px rgba(0,0,0,.09)
}

.product-image{
width:100%;
aspect-ratio:1/1;
object-fit:cover;
display:block;
background:#eee
}

.product-info{
padding:15px
}

.product-name{
font-size:15px;
font-weight:800;
margin-bottom:8px
}

.product-price{
font-size:18px;
font-weight:900
}

.shipping{
display:block;
font-size:10px;
color:#888;
font-weight:400;
margin-top:3px
}

.product-sizes{
display:flex;
flex-wrap:wrap;
gap:5px;
margin-top:12px
}

.size-small{
border:1px solid #ddd;
padding:5px 8px;
border-radius:7px;
font-size:10px
}

.modal{
display:none;
position:fixed;
inset:0;
z-index:500;
background:rgba(0,0,0,.7);
backdrop-filter:blur(7px);
align-items:center;
justify-content:center;
padding:12px
}

.modal.active{
display:flex
}

.modal-box{
width:100%;
max-width:1000px;
max-height:calc(100vh - 24px);
overflow-y:auto;
background:#fff;
border-radius:22px;
position:relative
}

.close{
position:absolute;
right:13px;
top:13px;
width:41px;
height:41px;
z-index:20;
border:0;
border-radius:50%;
background:#fff;
box-shadow:0 5px 20px rgba(0,0,0,.16);
font-size:25px;
cursor:pointer
}

.modal-grid{
display:grid;
grid-template-columns:1fr 1fr
}

.gallery{
padding:20px
}

.main-image{
width:100%;
aspect-ratio:1/1;
max-height:65vh;
object-fit:cover;
border-radius:17px;
background:#eee;
display:block
}

.thumbnails{
display:flex;
gap:9px;
margin-top:11px;
width:100%;
overflow-x:auto;
padding:2px 2px 8px
}

.thumbnail{
width:67px;
height:67px;
min-width:67px;
object-fit:cover;
border-radius:10px;
border:2px solid #ddd;
cursor:pointer;
transition:.15s
}

.thumbnail.active{
border:3px solid #111
}

.details{
padding:45px 30px 30px
}

.details h2{
font-size:31px;
letter-spacing:-1px;
margin-bottom:9px
}

.big-price{
font-size:28px;
font-weight:900
}

.big-shipping{
font-size:12px;
color:#888;
margin-top:4px
}

.description{
color:#555;
font-size:14px;
line-height:1.7;
margin:22px 0
}

.size-title{
font-size:14px;
font-weight:800;
margin-bottom:10px
}

.size-buttons{
display:flex;
flex-wrap:wrap;
gap:8px
}

.size-button{
background:#fff;
border:1px solid #ccc;
padding:10px 14px;
border-radius:9px;
cursor:pointer
}

.size-button.selected{
background:#111;
color:#fff;
border-color:#111
}

.copy-button,
.goated-button{
width:100%;
padding:16px;
border-radius:12px;
font-size:14px;
font-weight:800;
cursor:pointer
}

.copy-button{
margin-top:25px;
background:#111;
color:#fff;
border:0
}

.goated-button{
display:block;
margin-top:10px;
background:#fff;
color:#111;
border:1px solid #111;
text-align:center;
text-decoration:none
}

.goated-button:hover{
background:#111;
color:#fff
}

.copy-message{
min-height:18px;
text-align:center;
font-size:12px;
color:#555;
margin-top:9px
}

footer{
background:#111;
color:#fff;
text-align:center;
padding:55px 20px
}

.footer-logo{
display:flex;
justify-content:center;
align-items:center;
gap:9px;
margin-bottom:12px
}

.footer-icon{
width:36px;
height:36px;
border-radius:10px
}

footer strong{
font-size:23px
}

footer p{
color:#999;
font-size:13px;
margin-bottom:25px
}

.socials{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:9px
}

.social{
color:#fff;
text-decoration:none;
background:#191919;
border:1px solid #303030;
padding:11px 16px;
border-radius:10px;
font-size:13px
}

.welcome-overlay{
position:fixed;
inset:0;
z-index:9999;
display:flex;
align-items:center;
justify-content:center;
padding:18px;
background:rgba(0,0,0,.7);
backdrop-filter:blur(8px)
}

.welcome-box{
width:100%;
max-width:480px;
background:#fff;
border-radius:25px;
position:relative;
overflow:hidden;
box-shadow:0 30px 90px rgba(0,0,0,.3)
}

.welcome-close{
position:absolute;
right:13px;
top:13px;
width:39px;
height:39px;
border:0;
border-radius:50%;
background:#f1f1f1;
font-size:24px;
cursor:pointer
}

.welcome-content{
text-align:center;
padding:35px 27px 27px
}

.welcome-logo{
width:58px;
height:58px;
margin:0 auto 14px;
border-radius:18px;
font-size:21px
}

.welcome-content h2{
font-size:29px;
letter-spacing:-1px;
margin-bottom:9px
}

.welcome-content p{
color:#666;
line-height:1.55;
font-size:14px;
margin-bottom:20px
}

.welcome-offer{
background:#f2f2f2;
border-radius:15px;
padding:17px;
margin-bottom:18px
}

.welcome-offer strong{
display:block;
font-size:27px
}

.welcome-offer span{
color:#666;
font-size:12px
}

.welcome-features{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:7px;
margin-bottom:19px
}

.welcome-features div{
background:#f5f5f5;
padding:8px 10px;
border-radius:8px;
font-size:11px
}

.welcome-button{
display:block;
background:#111;
color:#fff;
text-decoration:none;
padding:16px;
border-radius:12px;
font-weight:800;
font-size:14px;
margin-bottom:9px
}

.browse-button{
width:100%;
padding:14px;
border:1px solid #ddd;
background:#fff;
border-radius:12px;
font-weight:800;
cursor:pointer
}

.welcome-content small{
display:block;
color:#999;
font-size:9px;
margin-top:13px
}

@media(max-width:1050px){
.products{
grid-template-columns:repeat(3,1fr)
}
}

@media(max-width:700px){

.nav{
padding:11px 15px
}

.logo{
font-size:21px
}

.hero{
padding:0 15px;
margin-top:20px
}

.hero-box{
padding:43px 25px;
border-radius:21px
}

.hero h1{
font-size:38px
}

.hero p{
font-size:16px
}

.search-area{
padding:0 15px 25px
}

.products{
grid-template-columns:repeat(2,1fr);
padding:0 15px 55px;
gap:12px
}

.modal{
padding:5px
}

.modal-box{
max-height:calc(100vh - 10px);
border-radius:18px
}

.modal-grid{
display:block
}

.gallery{
padding:12px;
padding-top:18px
}

.main-image{
max-height:42vh;
border-radius:13px
}

.thumbnail{
width:58px;
height:58px;
min-width:58px
}

.details{
padding:15px 18px 22px
}

.details h2{
font-size:24px
}

.big-price{
font-size:24px
}

.description{
margin:15px 0
}

.copy-button{
margin-top:18px
}

}

@media(max-width:390px){

.logo{
font-size:18px
}

.hero h1{
font-size:32px
}

}

</style>
</head>

<body>

<header>
<div class="nav">

<div class="logo-area">
<div class="logo-icon">AF</div>
<div class="logo">AlexFynds</div>
</div>

<div class="settings">

<button class="settings-btn" onclick="toggleSettings()" id="settingsButton">
🌐 Svenska · SEK
</button>

<div class="settings-menu" id="settingsMenu">

<label>Språk</label>

<select id="language" onchange="changeSettings()">
<option value="sv">🇸🇪 Svenska</option>
<option value="en">🇬🇧 English</option>
<option value="zh">🇨🇳 中文</option>
<option value="es">🇪🇸 Español</option>
<option value="de">🇩🇪 Deutsch</option>
<option value="fr">🇫🇷 Français</option>
<option value="ja">🇯🇵 日本語</option>
<option value="ko">🇰🇷 한국어</option>
</select>

<label>Valuta</label>

<select id="currency" onchange="changeSettings()">
<option value="SEK">SEK kr</option>
<option value="EUR">EUR €</option>
<option value="USD">USD $</option>
<option value="GBP">GBP £</option>
<option value="CNY">CNY ¥</option>
<option value="JPY">JPY ¥</option>
<option value="CHF">CHF Fr</option>
<option value="NOK">NOK kr</option>
<option value="DKK">DKK kr</option>
<option value="PLN">PLN zł</option>
</select>

</div>
</div>
</div>
</header>


<section class="hero">

<div class="hero-box">

<div class="hero-content">

<div class="hero-badge">ALEXFYNDS</div>

<h1>AlexFynds</h1>

<p id="heroText">
Hitta dina favoritprodukter
</p>

</div>
</div>

</section>


<div class="search-area">

<input
class="search"
id="search"
type="text"
placeholder="Sök produkter..."
oni
